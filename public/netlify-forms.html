<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ApexTechInfo enquiry form</title>
  </head>
  <body>
    <form
      name="mindloom-enquiry"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="mindloom-enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="company" />
      <input name="email" />
      <input name="phone" />
      <input name="services" />
      <input name="budget" />
      <input name="start-time" />
      <textarea name="description"></textarea>
    </form>
  </body>
</html>
